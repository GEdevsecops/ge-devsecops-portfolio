name: DevSecOps Lifecycle

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  validate:
    name: Clean Code & Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      
      - name: Install
        run: npm ci
        
      - name: Lint (Clean Code Validation)
        run: npm run lint
        
      - name: Test (Test Automation)
        run: npm run test
        
      - name: Build (Staging Readiness)
        run: npm run build